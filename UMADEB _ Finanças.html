<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UMADEB | Finanças</title>
<style>
:root{--bg:#070b1c;--sf:#0e1530;--sf2:#131c3d;--bd:#1f2a55;--tx:#e8ecff;--mt:#8a95c4;--ac:#38bdf8;--ok:#34d399;--er:#f87171;--wn:#fbbf24;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(900px 400px at 80% -10%,#14235a,transparent 60%),var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:1120px;margin:0 auto;padding:14px 14px 80px}
.hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:10px 14px;margin-bottom:18px}
.lg{display:flex;align-items:center;gap:10px;font-weight:700}.lg i{width:38px;height:38px;border-radius:11px;background:var(--ac);color:#06142e;display:grid;place-items:center;font-style:normal;font-weight:800}.lg small{display:block;font-weight:500;color:var(--mt);font-size:11px}
.tabs{display:flex;gap:4px;margin-left:auto;overflow-x:auto;max-width:100%}.tabs button{background:none;border:0;color:var(--mt);padding:9px 13px;border-radius:11px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}.tabs button.on{background:#12265e;color:var(--ac)}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--bd);color:var(--mt);white-space:nowrap}.pill.on{color:var(--ok);border-color:#14604f}
h1{margin:0;font-size:26px}.sb{color:var(--mt);margin:2px 0 0;font-size:14px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.top>div{flex:1;min-width:200px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--sf2);border:1px solid var(--bd);border-radius:9px;padding:9px;width:100%}
input:hover,select:hover,textarea:hover{border-color:var(--ac)}input:focus,select:focus,textarea:focus{outline:2px solid var(--ac)}
input[type=color]{width:50px;height:40px;padding:2px}
.btn{background:var(--ac);color:#06142e;border:0;border-radius:10px;padding:9px 15px;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}.btn.g{background:#0d3a33;color:var(--ok);border:1px solid #14604f}.btn.r{background:#3a1420;color:var(--er);border:1px solid #6a2335}.btn.s{background:var(--sf2);color:var(--ac);border:1px solid var(--bd)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.k,.p{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:14px 16px}.k small{color:var(--mt);font-size:11px;letter-spacing:.7px;text-transform:uppercase;font-weight:700}.k b{display:block;font-size:24px;margin:6px 0 2px}.k span{font-size:12px;color:var(--mt)}
.ok{color:var(--ok)}.er{color:var(--er)}.wn{color:var(--wn)}
.p h3{margin:0 0 10px;font-size:15px}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-bottom:12px}
.cash{border:1px solid #1d5a8a;background:linear-gradient(135deg,#0e2a55,#0e1530)}.cash input{font-size:26px;font-weight:700;margin-top:6px}
.dn{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.donut{width:130px;height:130px;border-radius:50%;position:relative;flex:none}.donut::after{content:"";position:absolute;inset:28px;border-radius:50%;background:var(--sf)}
.lgd p{margin:4px 0;font-size:13px;display:flex;gap:8px;align-items:center}.lgd i{width:10px;height:10px;border-radius:3px;flex:none}
.li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}.li:first-of-type{border-top:0}.li small{color:var(--mt);display:block}
.tw{overflow-x:auto;background:var(--sf);border:1px solid var(--bd);border-radius:16px}table{border-collapse:collapse;width:100%;min-width:820px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mt);text-align:left;padding:9px 6px}td{padding:4px;border-top:1px solid var(--bd);vertical-align:middle}td input,td select{min-width:76px}.n{white-space:nowrap;padding:4px 8px}
.stp{display:flex;gap:3px;align-items:center}.stp button{width:32px;height:36px;flex:none;border:1px solid var(--bd);background:var(--sf2);color:var(--ac);border-radius:8px;font-size:17px;cursor:pointer}.stp input{width:58px;min-width:50px;text-align:center;font-weight:700}
.x{background:none;border:0;color:var(--mt);cursor:pointer;font:inherit;padding:6px}.x.a{background:var(--er);color:#fff;border-radius:8px}.chk{width:22px;height:22px;min-width:0;accent-color:var(--ok)}
.mt{color:var(--mt);font-size:13px}.ts{margin:0 0 10px;color:var(--mt);font-size:14px}.ts b{color:var(--tx)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#3a1420;color:#fff;border:1px solid #6a2335;border-radius:12px;padding:10px 16px;display:none;z-index:9;max-width:90%}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cal>b{text-align:center;font-size:12px;color:var(--mt)}
.day{min-height:84px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:5px;cursor:pointer;overflow:hidden;font-size:11px}.day:hover{border-color:var(--ac)}.day.t{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}.day span{font-weight:700;font-size:12px}
.ch{display:block;margin-top:2px;padding:1px 5px;border-radius:5px;color:#06142e;font-style:normal;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chip{display:inline-block;padding:2px 9px;border-radius:99px;color:#06142e;font-size:12px;font-weight:700}
.c-nacional{background:#34d399}.c-estadual{background:#38bdf8}.c-municipal{background:#a78bfa}.c-facultativo{background:#fbbf24}.c-cristã{background:#f472b6}.c-juventude{background:#fb7185}.c-evento{background:#fff}
#modal{position:fixed;inset:0;background:rgba(3,6,20,.7);display:none;align-items:center;justify-content:center;padding:12px;z-index:20}#mbox{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:18px;width:460px;max-width:100%;max-height:88vh;overflow:auto}
@media(max-width:700px){.day{min-height:56px}.ch{font-size:0;height:6px;padding:0}}
.th{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px}.thb{display:flex;align-items:center;gap:8px;background:var(--sf2);border:1px solid var(--bd);border-radius:12px;padding:9px;color:var(--tx);font:inherit;cursor:pointer}.thb i{width:22px;height:22px;border-radius:50%;background:var(--c);flex:none}.thb.on{border-color:var(--c);box-shadow:0 0 0 2px var(--c)}
.seg{display:flex;background:var(--sf2);border:1px solid var(--bd);border-radius:12px;padding:3px;gap:3px}.seg button{flex:1;border:0;background:none;color:var(--mt);padding:8px;border-radius:9px;font:inherit;font-weight:600;cursor:pointer}.seg button.on{background:var(--ac);color:#06142e}
.bar2{height:10px;border-radius:6px;background:var(--sf2);overflow:hidden;margin:10px 0 6px}.bar2 i{display:block;height:100%;background:var(--ac);border-radius:6px}
.chipx{display:inline-flex;gap:6px;align-items:center;background:var(--sf2);border:1px solid var(--bd);border-radius:99px;padding:5px 6px 5px 12px;margin:3px}.chipx button{border:0;background:none;color:var(--mt);cursor:pointer;font-size:15px}
.priv .k b,.priv .li b,.priv .n,.priv .lgd b,.priv td input[inputmode=decimal],.priv .cash input{filter:blur(7px)}.cmp{font-size:14px}.cmp td{padding:1px 3px}.cmp .k,.cmp .p{padding:9px 12px}
@media(max-width:700px){.tabs{margin-left:0;width:100%}}
</style>
</head>
<body>
<div class="w" id="app"></div><div id="toast"></div><div id="modal" onclick="if(event.target.id=='modal')mc()"><div id="mbox"></div></div>
<script>
const KEY='umadeb_pro_local',COL=['cfg','events','items','log'];
let S={cfg:{},events:[],items:[],log:[]},db=null,shared=false,ME=null,T='dash',armed='',pend=false,fnew='',PV='',CM=new Date().getMonth(),CY=new Date().getFullYear();
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const pm=v=>{let s=String(v).replace(/[R$\s]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return Math.max(0,+s||0)},fm=v=>v?Number(v).toFixed(2).replace('.',','):'';
const sm=a=>a.reduce((x,i)=>x+(+i.val||0),0),fd=d=>d?d.split('-').reverse().join('/'):'',TODAY=new Date().toISOString().slice(0,10);
const CAT=['Alimentação','Decoração','Som e iluminação','Transporte','Materiais','Camisetas','Aluguel de espaço','Divulgação','Ofertas','Contribuições','Patrocínios','Inscrições','Doações','Outros'];
const PAL=['#38bdf8','#34d399','#fbbf24','#f87171','#a78bfa','#fb923c','#2dd4bf','#f472b6','#94a3b8'];
const CF=()=>({name:'UMADEB',sub:'Finanças e eventos',color:'#38bdf8',group:0,cash:0,...S.cfg}),who=()=>(ME&&ME.name)||'Você';
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display='none',4500)}
const er=()=>toast('Não foi possível salvar. Verifique se você tem permissão de edição.');
// Banco local de reserva (quando não há login do Claude)
function makeDb(){let D={};try{D=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}const L={},cl=d=>JSON.parse(JSON.stringify(d)),pe=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}},fire=k=>(L[k]||[]).forEach(f=>f());
return{collection:k=>({doc:id=>({set:async d=>{(D[k]=D[k]||{})[id]=cl(d);pe();fire(k)},update:async d=>{D[k]=D[k]||{};D[k][id]={...(D[k][id]||{}),...cl(d)};pe();fire(k)},delete:async()=>{if(D[k])delete D[k][id];pe();fire(k)}}),onSnapshot:n=>{const f=()=>n({docs:Object.entries(D[k]||{}).map(([id,v])=>({id,data:()=>v}))});(L[k]=L[k]||[]).push(f);setTimeout(f)}})}}
const logit=()=>{};
// Cálculos
function tot(){const I=S.items.filter(i=>i.type=='in'),O=S.items.filter(i=>i.type=='out'),c=+CF().cash||0,iD=sm(I.filter(i=>i.done)),oD=sm(O.filter(i=>i.done));return{I:sm(I),O:sm(O),cash:c,caixa:c+iD-oD,rec:sm(I)-iD,pay:sm(O)-oD}}
function gauge(r){const P=a=>[100-80*Math.cos(a*Math.PI/180),100-80*Math.sin(a*Math.PI/180)],sg=(a,b,c)=>{const p=P(a),q=P(b);return `<path d="M${p[0]} ${p[1]}A80 80 0 0 1 ${q[0]} ${q[1]}" stroke="${c}" stroke-width="16" fill="none"/>`},an=(r==null?0:Math.min(2,Math.max(0,r)))*90,x=100-62*Math.cos(an*Math.PI/180),y=100-62*Math.sin(an*Math.PI/180);
return `<svg viewBox="0 0 200 118" style="width:100%;max-width:300px">${sg(0,54,'#f87171')}${sg(54,90,'#fbbf24')}${sg(90,135,'#a3e635')}${sg(135,180,'#34d399')}<line x1="100" y1="100" x2="${x}" y2="${y}" stroke="#e8ecff" stroke-width="3" stroke-linecap="round"/><circle cx="100" cy="100" r="6" fill="#e8ecff"/></svg>`}
function bars(){const m={};S.items.forEach(i=>{const k=(i.date||'').slice(0,7);if(!k)return;m[k]=m[k]||{in:0,out:0};m[k][i.type]+=+i.val||0});const ks=Object.keys(m).sort().slice(-6);if(!ks.length)return '<p class="mt">Lance movimentos com data para ver o gráfico.</p>';const mx=Math.max(1,...ks.flatMap(k=>[m[k].in,m[k].out]));
return `<svg viewBox="0 0 ${ks.length*60+10} 128" style="width:100%;max-height:200px">${ks.map((k,n)=>{const x=10+n*60,a=m[k].in/mx*90,b=m[k].out/mx*90;return `<rect x="${x}" y="${100-a}" width="22" height="${a}" rx="3" fill="#34d399"/><rect x="${x+25}" y="${100-b}" width="22" height="${b}" rx="3" fill="#f87171"/><text x="${x+23}" y="118" text-anchor="middle" font-size="10" fill="#8a95c4">${k.slice(5)}/${k.slice(2,4)}</text>`}).join('')}</svg><p class="mt"><span class="ok">■</span> Entradas &nbsp;<span class="er">■</span> Saídas</p>`}
function dash(){const t=tot(),proj=t.caixa+t.rec-t.pay,r=(v=>v==null?null:v*(+CF().sens||1))(t.pay>0?(t.caixa+t.rec)/t.pay:(t.caixa>0?2:(t.rec>0?1.2:null))),
st=r==null?['Sem dados','mt']:r<.6?['Crítico','er']:r<1?['Atenção','wn']:r<1.5?['Estável','ok']:['Saudável','ok'],
cats={};S.items.filter(i=>i.type=='out').forEach(i=>{const k=i.cat||'Outros';cats[k]=(cats[k]||0)+(+i.val||0)});const ce=Object.entries(cats).sort((a,b)=>b[1]-a[1]),D=t.O;let ac=0;const cs=ce.map(([k,v],n)=>{const a=ac/D*100;ac+=v;return PAL[n%9]+' '+a+'% '+ac/D*100+'%'}).join(',');
const pd=S.items.filter(i=>!i.done).sort((a,b)=>(a.date||'9')>(b.date||'9')?1:-1).slice(0,6),K=(l,v,s,c='')=>`<div class="k"><small>${l}</small><b class="${c}">${v}</b><span>${s}</span></div>`;
return `<div class="top"><div><h1>Resumo Financeiro</h1><p class="sb">Caixa, extrato e saúde financeira em um só lugar.</p></div><button class="btn" onclick="newEv('')">+ Evento</button><button class="btn g" onclick="add('items','in')">+ Entrada</button><button class="btn r" onclick="add('items','out')">+ Saída</button></div>
<div class="cards"><div class="k cash"><small>Valor em caixa (saldo inicial)</small><input type="text" inputmode="decimal" placeholder="R$ 0,00" value="${fm(t.cash)}" onchange="setCash(this)"><span>Digite o que já existe em caixa hoje.</span></div>${K('Caixa atual',brl(t.caixa),+CF().meta?Math.round(t.caixa/CF().meta*100)+'% da meta de '+brl(CF().meta):'Saldo inicial + movimentos efetivados',t.caixa<0?'er':'ok')}${K('A receber',brl(t.rec),'Entradas pendentes','ok')}${K('A pagar',brl(t.pay),'Saídas pendentes','er')}${K(proj<0?'Vai faltar':'Vai sobrar',brl(Math.abs(proj)),'Caixa + a receber − a pagar',proj<0?'er':'ok')}</div>
<div class="g2"><div class="p" style="text-align:center"><h3 style="text-align:left">Bússola financeira</h3>${gauge(r)}<div class="${st[1]}" style="font-size:22px;font-weight:800;margin-top:-6px">${st[0]}</div><p class="mt" style="margin:4px 0 0">${r==null?'Lance valores para calibrar a bússola.':'Cobertura de '+r.toFixed(2).replace('.',',')+'x · (caixa + a receber) ÷ a pagar'}</p></div>
<div class="p"><h3>Entradas × saídas por mês</h3>${bars()}</div></div>
${evPanel()}<div class="g2"><div class="p"><h3>Despesas por categoria</h3>${D?`<div class="dn"><div class="donut" style="background:conic-gradient(${cs})"></div><div class="lgd">${ce.map(([k,v],n)=>`<p><i style="background:${PAL[n%9]}"></i>${esc(k)} · <b>${brl(v)}</b></p>`).join('')}</div></div>`:'<p class="mt">Sem saídas lançadas.</p>'}</div>
<div class="p"><h3>Próximos vencimentos</h3>${pd.map(i=>`<div class="li"><div>${esc(i.desc||'(sem descrição)')}<small>${i.type=='in'?'A receber':'A pagar'} · ${fd(i.date)||'sem data'}</small></div><div style="text-align:right"><b class="${i.type=='in'?'ok':'er'}">${brl(i.val)}</b><br><button class="btn s" style="padding:3px 10px;margin-top:3px" onclick="fin('${i.id}')">${i.type=='in'?'Recebi':'Paguei'}</button></div></div>`).join('')||'<p class="mt">Nada pendente.</p>'}</div></div>`}
const mi=(k,id,f,v)=>`<input type="text" inputmode="decimal" placeholder="0,00" value="${fm(v)}" onchange="ed('${k}','${id}','${f}',this,'m')">`;
function sorted(){return S.items.slice().sort((a,b)=>(a.date||'0')<(b.date||'0')?-1:(a.date||'0')>(b.date||'0')?1:(a.id>b.id?1:-1))}
function balm(){const o={};let b=+CF().cash||0;sorted().forEach(i=>{if(i.done)b+=(i.type=='in'?1:-1)*(+i.val||0);o[i.id]=b});return o}
function tsum(){const t=tot();return `Entradas <b class="ok">${brl(t.I)}</b> · Saídas <b class="er">${brl(t.O)}</b> · Caixa atual <b>${brl(t.caixa)}</b> · Previsto <b>${brl(t.caixa+t.rec-t.pay)}</b>`}
function ext(){const bm=balm();return `<div class="top"><div><h1>Extrato</h1><p class="sb">Todas as entradas e saídas, com o saldo linha a linha.</p></div><button class="btn g" onclick="add('items','in')">+ Entrada</button><button class="btn r" onclick="add('items','out')">+ Saída</button></div><p class="ts" id="ts">${tsum()}</p>
<datalist id="cat">${catList().map(c=>`<option>${c}</option>`).join('')}</datalist><div class="tw"><table><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Tipo</th><th>Valor (R$)</th><th>Evento</th><th>Efetivado</th><th>Saldo</th><th></th></tr>${sorted().map(i=>{const e=`ed('items','${i.id}'`;return `<tr data-id="${i.id}"><td><input type="date" value="${esc(i.date)}" onchange="${e},'date',this)"></td><td><input value="${esc(i.desc)}" placeholder="Descrição" onchange="${e},'desc',this)"></td><td><input list="cat" value="${esc(i.cat)}" placeholder="Categoria" onchange="${e},'cat',this)"></td><td><select onchange="${e},'type',this)"><option value="in" ${i.type=='in'?'selected':''}>Entrada</option><option value="out" ${i.type=='out'?'selected':''}>Saída</option></select></td><td>${mi('items',i.id,'val',i.val)}</td><td><select onchange="${e},'ev',this)"><option value="">—</option>${S.events.map(v=>`<option value="${v.id}" ${i.ev==v.id?'selected':''}>${esc(v.name||'(sem nome)')}</option>`).join('')}</select></td><td style="text-align:center"><input class="chk" type="checkbox" ${i.done?'checked':''} onchange="tg('${i.id}',this)"></td><td class="n" id="b_${i.id}">${brl(bm[i.id])}</td><td>${dbtn('items',i.id)}</td></tr>`}).join('')||'<tr><td colspan="9" class="mt" style="padding:14px">Nenhum lançamento. Use + Entrada ou + Saída.</td></tr>'}</table></div><p class="mt">Marque “Efetivado” quando o dinheiro já entrou ou saiu do caixa. O saldo só considera os efetivados.</p>`}
const stp=(e,f)=>`<div class="stp"><button onclick="bump('${e.id}','${f}',-1)">−</button><input id="${f}_${e.id}" type="text" inputmode="numeric" value="${e[f]||0}" onchange="ed('events','${e.id}','${f}',this,'n')"><button onclick="bump('${e.id}','${f}',1)">+</button></div>`;
function cl(e){const o=sm(S.items.filter(i=>i.type=='out'&&i.ev==e.id)),b=+e.budget||0,g=+CF().group||0,w=g-(+e.going||0)-(+e.not||0);return{o:brl(o),l:b?brl(b-o):'—',lc:'n '+(b?(b-o<0?'er':'ok'):''),w:g?Math.max(0,w):'—',wc:g&&w<0?'n er':'n'}}
function evs(){const g=+CF().group||0;return `<div class="top"><div><h1>Eventos e presença</h1><p class="sb">Orçamento, quem vai e quem não vai.</p></div><label class="mt">Quantidade do grupo <input style="width:100px;display:inline-block" type="text" inputmode="numeric" value="${g||''}" placeholder="0" onchange="setCfg('group',Math.round(pm(this.value)))"></label><button class="btn" onclick="add('events')">+ Evento</button></div>
